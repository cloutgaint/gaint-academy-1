name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt
      - name: API compile check
        env:
          PYTHONPATH: .
        run: python -m compileall app migrations
      - name: API tests
        env:
          PYTHONPATH: .
        run: python -m pytest
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gaint
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: gaint_academy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gaint -d gaint_academy"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt
      - name: Apply all migrations
        env:
          DATABASE_URL: postgresql+psycopg://gaint:ci-password@localhost:5432/gaint_academy
        run: alembic upgrade head
      - name: Verify migration head
        env:
          DATABASE_URL: postgresql+psycopg://gaint:ci-password@localhost:5432/gaint_academy
        run: alembic current
      - name: DB-backed tenant and IDOR tests
        env:
          DATABASE_URL: postgresql+psycopg://gaint:ci-password@localhost:5432/gaint_academy
          RUN_DB_INTEGRATION: "1"
          PYTHONPATH: .
        run: python -m pytest tests/integration/test_tenant_idor_db.py -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
